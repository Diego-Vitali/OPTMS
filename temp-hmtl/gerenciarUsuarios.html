<%@ page contentType="text/html; charset=UTF-8" pageEncoding="UTF-8"%>
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <style>
        body {
            background-color: #000000;
            font-family: 'Poppins', sans-serif;
            color: #e0e0e0;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .management-card {
            background-color: #121212;
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(230, 81, 0, 0.10);
            border: 1px solid #333;
            margin-top: 50px;
        }

        h4 {
            font-weight: 600;
            color: #ffffff;
            font-size: 1.8rem;
        }

        .btn-primary {
            background-color: #e65100;
            border-color: #e65100;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #bf360c;
            border-color: #bf360c;
        }

        .btn-danger {
            background-color: #cf352e;
            border-color: #cf352e;
            border-radius: 10px;
        }

        .btn-sm {
            padding: 5px 15px;
            font-size: 0.85rem;
        }

        .table {
            color: #cccccc;
            margin-top: 20px;
            border-color: #333;
        }

        .table thead th {
            background-color: #1e1e1e;
            color: #e65100;
            border-bottom: 2px solid #333;
            border-top: none;
            font-weight: 600;
            padding: 15px;
        }

        .table tbody td {
            background-color: transparent;
            border-bottom: 1px solid #333;
            padding: 15px;
            vertical-align: middle;
        }

        .table-hover tbody tr:hover td {
            color: #fff;
            background-color: #1e1e1e;
        }

        .modal-content {
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 20px;
            color: #fff;
        }

        .modal-header {
            border-bottom: 1px solid #333;
            background-color: #1e1e1e;
            border-radius: 20px 20px 0 0;
        }

        .modal-footer {
            border-top: 1px solid #333;
            background-color: #1e1e1e;
            border-radius: 0 0 20px 20px;
        }

        .btn-close-white {
            filter: invert(1) grayscale(100%) brightness(200%);
        }

        .form-control, .form-select {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            padding: 10px;
        }

        .form-control:focus, .form-select:focus {
            background-color: #252525;
            border-color: #e65100;
            box-shadow: 0 0 0 0.25rem rgba(230, 81, 0, 0.25);
            color: #fff;
            outline: none;
        }

        .btn-secondary {
            background-color: #333;
            border-color: #333;
            color: #ccc;
            border-radius: 10px;
        }
        
        .btn-secondary:hover {
            background-color: #444;
            border-color: #444;
        }

        .alert-success {
            background-color: rgba(25, 135, 84, 0.2);
            border-color: rgba(25, 135, 84, 0.3);
            color: #75b798;
            border-radius: 10px;
        }

    </style>
</head>
<body>

    <%@ include file="includes/navbar.jsp" %>

    <div class="container">
        <div class="management-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="mb-0">Gerenciar Usuários</h4>
                <button class="btn btn-primary fw-bold" id="btnNovoUsuario">+ Novo Usuário</button>
            </div>
            
            <div class="table-responsive">
                <table class="table table-hover" id="tabela-usuarios">
                    <thead>
                        <tr>
                            <th width="5%">ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th width="15%">Perfil</th>
                            <th width="20%" class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
            <div id="alertFeedback" class="alert alert-success mt-3" style="display:none;"></div>
        </div>
    </div>

    <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Novo Usuário</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formUsuario">
                        <input type="hidden" id="userIdInput">
                        <div class="mb-3">
                            <label for="nomeInput" class="form-label text-muted small">Nome Completo</label>
                            <input type="text" class="form-control" id="nomeInput" required>
                        </div>
                        <div class="mb-3">
                            <label for="emailInput" class="form-label text-muted small">E-mail</label>
                            <input type="email" class="form-control" id="emailInput" required>
                        </div>
                        <div class="mb-3">
                            <label for="senhaInput" class="form-label text-muted small">Senha</label>
                            <input type="password" class="form-control" id="senhaInput">
                        </div>
                        <div class="mb-3">
                            <label for="perfilInput" class="form-label text-muted small">Perfil</label>
                            <select class="form-select" id="perfilInput">
                                <option value="comum">Usuário Padrão</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnSalvarUsuario">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    $(document).ready(function() {
        
        function carregarUsuarios() {
            $.ajax({
                url: 'usuarioServlet?action=list',
                type: 'GET',
                dataType: 'json',
                success: function(listaUsuarios) {
                    var tbody = $('#tabela-usuarios tbody');
                    tbody.empty();

                    $.each(listaUsuarios, function(index, usuario) {
                        var tr = 
                            '<tr>' +
                                '<td>' + usuario.id + '</td>' +
                                '<td>' + usuario.nome + '</td>' +
                                '<td>' + usuario.email + '</td>' +
                                '<td>' + usuario.tipo + '</td>' +
                                '<td class="text-center">' +
                                    '<button class="btn btn-sm btn-primary btn-editar" data-id="' + usuario.id + '">Editar</button> ' +
                                    '<button class="btn btn-sm btn-danger btn-excluir ms-2" data-id="' + usuario.id + '">Excluir</button>' +
                                '</td>' +
                            '</tr>';
                        tbody.append(tr);
                    });
                },
                error: function(xhr, status, error) {
                    console.error("Erro ao carregar usuários");
                }
            });
        }

        $("#btnNovoUsuario").click(function() {
            $("#modalTitle").text("Novo Usuário");
            $("#userIdInput").val("");
            $("#formUsuario")[0].reset();
            $("#userModal").modal("show");
        });

        $(document).on("click", ".btn-editar", function() {
            var id = $(this).data("id");
            var linha = $(this).closest("tr");
            var nome = linha.find("td:eq(1)").text();
            var email = linha.find("td:eq(2)").text();
            var tipo = linha.find("td:eq(3)").text();
            
            $("#modalTitle").text("Editar Usuário");
            $("#userIdInput").val(id);
            $("#nomeInput").val(nome);
            $("#emailInput").val(email);
            $("#perfilInput").val(tipo);
            $("#senhaInput").val(""); 
            $("#userModal").modal("show");
        });

        $("#btnSalvarUsuario").click(function() {
            var id = $("#userIdInput").val();
            var nome = $("#nomeInput").val();
            var email = $("#emailInput").val();
            var senha = $("#senhaInput").val();
            var perfil = $("#perfilInput").val();

            $.ajax({
                url: "usuarioServlet",
                type: "POST",
                data: {
                    action: "save",
                    id: id,
                    nome: nome,
                    email: email,
                    senha: senha,
                    perfil: perfil
                },
                success: function() {
                    $("#userModal").modal("hide");
                    carregarUsuarios(); 
                    $("#alertFeedback").text("Salvo com sucesso!").fadeIn().delay(2000).fadeOut();
                },
                error: function() {
                    alert("Erro ao salvar.");
                }
            });
        });

        $(document).on("click", ".btn-excluir", function() {
            var id = $(this).data("id");
            if(confirm("Deseja excluir?")) {
                $.ajax({
                    url: "usuarioServlet",
                    type: "POST",
                    data: { action: "delete", id: id },
                    success: function() {
                        carregarUsuarios();
                    }
                });
            }
        });

        carregarUsuarios();
    });
    </script>
</body>
</html>
