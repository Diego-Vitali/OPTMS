<%@ page contentType="text/html; charset=UTF-8" pageEncoding="UTF-8"%>
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão de Frete</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <style>
        body {
            background-color: #000000;
            font-family: 'Poppins', sans-serif;
            color: #e0e0e0;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Container Principal do Formulário */
        .prediction-card {
            background-color: #121212;
            border-radius: 40px;
            padding: 60px;
            box-shadow: 0 15px 35px rgba(230, 81, 0, 0.10);
            border: 1px solid #333;
            margin-top: 50px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Título da Página */
        h4 {
            font-weight: 600;
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 40px;
            text-align: center;
        }

        /* Labels dos Inputs */
        .form-label {
            color: #cccccc;
            font-weight: 300;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        /* Estilização dos Inputs e Selects */
        .form-control, .form-select {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            padding: 12px 15px;
            font-size: 1rem;
        }

        /* Estado de Foco (quando clica no input) */
        .form-control:focus, .form-select:focus {
            background-color: #252525;
            border-color: #e65100;
            box-shadow: 0 0 0 0.25rem rgba(230, 81, 0, 0.25);
            color: #fff;
            outline: none;
        }

        /* Botão Principal */
        .btn-primary {
            background-color: #e65100;
            border-color: #e65100;
            border-radius: 12px;
            padding: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-primary:hover, .btn-primary:focus {
            background-color: #bf360c;
            border-color: #bf360c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 81, 0, 0.3);
        }

        /* Caixa de Resultado */
        #boxResultado {
            background-color: #1e1e1e !important; /* Força fundo escuro */
            border: 1px solid #333 !important;
            border-radius: 16px !important;
            padding: 25px !important;
            margin-top: 40px !important;
        }

        #boxResultado h5 {
            color: #999;
            font-weight: 300;
        }

        /* TRUQUE CSS: O seu JS adiciona 'text-dark' (preto) ao resultado enquanto calcula.
           Isso ficaria invisível no fundo preto. Esta regra força ser branco. */
        #resultadoSpan.text-dark {
            color: #ffffff !important; 
        }

        /* Mantém o verde e vermelho padrão do bootstrap visíveis */
        #resultadoSpan.text-success {
            color: #28a745 !important;
        }
        #resultadoSpan.text-danger {
            color: #dc3545 !important;
        }

        #resultadoSpan {
            font-size: 1.5rem;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .prediction-card {
                padding: 30px 20px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>

    <%@ include file="includes/navbar.jsp" %>
    
    <div class="container">
        <div class="prediction-card">
            
            <h4>Calcular Previsão de Frete</h4>
            
            <form id="formFrete">
                
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="pesoBrutoInput" class="form-label">Peso Bruto (kg)</label>
                        <input type="text" class="form-control" id="pesoBrutoInput" value="150.5">
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label for="metroCubicoInput" class="form-label">Metro Cúbico (m³)</label>
                        <input type="text" class="form-control" id="metroCubicoInput" value="10.0">
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="ufOrigemInput" class="form-label">UF Origem</label>
                        <select class="form-select" id="ufOrigemInput">
                            <option value="AC">AC</option>
                            <option value="AL">AL</option>
                            <option value="AP">AP</option>
                            <option value="AM">AM</option>
                            <option value="BA">BA</option>
                            <option value="CE">CE</option>
                            <option value="DF">DF</option>
                            <option value="ES">ES</option>
                            <option value="GO">GO</option>
                            <option value="MA">MA</option>
                            <option value="MT">MT</option>
                            <option value="MS">MS</option>
                            <option value="MG">MG</option>
                            <option value="PA">PA</option>
                            <option value="PB">PB</option>
                            <option value="PR">PR</option>
                            <option value="PE">PE</option>
                            <option value="PI">PI</option>
                            <option value="RJ">RJ</option>
                            <option value="RN">RN</option>
                            <option value="RS">RS</option>
                            <option value="RO">RO</option>
                            <option value="RR">RR</option>
                            <option value="SC">SC</option>
                            <option value="SP" selected>SP</option>
                            <option value="SE">SE</option>
                            <option value="TO">TO</option>
                        </select>
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label for="ufDestinoInput" class="form-label">UF Destino</label>
                        <select class="form-select" id="ufDestinoInput">
                            <option value="AC">AC</option>
                            <option value="AL">AL</option>
                            <option value="AP">AP</option>
                            <option value="AM">AM</option>
                            <option value="BA">BA</option>
                            <option value="CE">CE</option>
                            <option value="DF">DF</option>
                            <option value="ES">ES</option>
                            <option value="GO">GO</option>
                            <option value="MA">MA</option>
                            <option value="MT">MT</option>
                            <option value="MS">MS</option>
                            <option value="MG">MG</option>
                            <option value="PA">PA</option>
                            <option value="PB">PB</option>
                            <option value="PR">PR</option>
                            <option value="PE">PE</option>
                            <option value="PI">PI</option>
                            <option value="RJ">RJ</option> 
                            <option value="RN">RN</option>
                            <option value="RS">RS</option>
                            <option value="RO">RO</option>
                            <option value="RR">RR</option>
                            <option value="SC">SC</option>
                            <option value="SP" selected>SP</option>
                            <option value="SE">SE</option>
                            <option value="TO">TO</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="valorMercadoriaInput" class="form-label">Valor Declarado (R$)</label>
                        <input type="text" class="form-control" id="valorMercadoriaInput" value="100.00">
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label for="quantidadeVolumesInput" class="form-label">Quantidade de Volumes</label>
                        <input type="text" class="form-control" id="quantidadeVolumesInput" value="1">
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="tipoFreteInput" class="form-label">Tipo de Frete</label>
                        <select class="form-select" id="tipoFreteInput">
                            <option value="FRACIONADO">FRACIONADO</option>
                            <option value="ITINERANTE">ITINERANTE</option>
                        </select>
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label for="viaTransporteInput" class="form-label">Via de Transporte</label>
                        <select id="viaTransporteInput" name="viaTransporteInput" class="form-select">
                            <option value="RODOVIÁRIO">RODOVIÁRIO</option>
                            <option value="AÉREO">AÉREO</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="button" id="btnPrever" class="btn btn-primary btn-lg">CALCULAR PREVISÃO</button>
                </div>

            </form>

            <div id="boxResultado" style="display:none;">
                <h5 class="mb-0 text-center">
                    Estimativa: <span id="resultadoSpan" class="fw-bold"></span>
                </h5>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    $(document).ready(function() {
        
        $("#btnPrever").click(function() {
            // Mostra a caixa de resultado e indica carregamento
            $("#boxResultado").fadeIn(); // Mudei para fadeIn para ficar mais suave
            $("#resultadoSpan").text("Calculando...");
            $("#resultadoSpan").removeClass("text-danger text-success").addClass("text-dark");

            // Captura os dados (incluindo os selects)
            var peso = $("#pesoBrutoInput").val();
            var ufOrigem = $("#ufOrigemInput").val();
            var ufDestino = $("#ufDestinoInput").val();
            var metroCubico = $("#metroCubicoInput").val();
            var valorMercadoria = $("#valorMercadoriaInput").val();
            var quantidadeVolumes = $("#quantidadeVolumesInput").val();
            var tipoFrete = $("#tipoFreteInput").val();
            var viaTransporte = $("#viaTransporteInput").val();

            $.ajax({
                url: "${pageContext.request.contextPath}/previsaoServlet", 
                type: "POST",          
                data: {                 
                    pesoBrutoInput: peso,
                    ufOrigemInput: ufOrigem,
                    ufDestinoInput: ufDestino,
                    metroCubicoInput: metroCubico,
                    valorMercadoriaInput: valorMercadoria,
                    quantidadeVolumesInput: quantidadeVolumes,
                    tipoFreteInput: tipoFrete,
                    viaTransporteInput: viaTransporte,
                },
                
                success: function(responseJson) {
                    let dias = Number(responseJson.transitTimeOutput);
                    let diasArredondado = Math.round(dias);
                    
                    $("#resultadoSpan").text(diasArredondado + " dias");
                    $("#resultadoSpan").addClass("text-success");
                },
                
                error: function(xhr, status, error) {
                    $("#resultadoSpan").text("Erro ao calcular.");
                    $("#resultadoSpan").addClass("text-danger");
                }
            });
        });
    });
    </script>

</body>
</html>
