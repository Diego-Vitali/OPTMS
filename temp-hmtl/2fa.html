<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Autenticação</title>
    
    <link href="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css](https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css)" rel="stylesheet">
    <link href="[https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap](https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap)" rel="stylesheet">
    
    <script src="[https://code.jquery.com/jquery-3.6.0.min.js](https://code.jquery.com/jquery-3.6.0.min.js)"></script>

<style>
    body {
        background-color: #000000;
        font-family: 'Poppins', sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        color: #e0e0e0;
    }

    .login-container {
        background-color: #121212;
        width: 1000px;
        max-width: 90%;
        min-height: 600px;
        border-radius: 40px;
        box-shadow: 0 15px 35px rgba(230, 81, 0, 0.15);
        overflow: hidden;
        display: flex;
    }

    .login-content {
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 50%;
        height: 100%;
    }

    .login-image {
        width: 50%;
        background-image: url('../frontend-java/assets/login_screen.jpg');
        background-size: cover;
        background-position: center;
        position: relative;
    }

    .login-image::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to right, #121212, transparent);
    }

    h4 {
        font-weight: 600;
        color: #ffffff;
        font-size: 2rem;
        margin-bottom: 20px;
    }

    .text-muted {
        color: #888 !important;
        margin-bottom: 50px;
    }

    .form-label {
        color: #cccccc;
        font-weight: 300;
    }

    /* Estilo específico para o input de OTP (Código) */
    .form-control.otp-input {
        background-color: #1e1e1e;
        border: 1px solid #333;
        border-radius: 12px;
        color: #e65100; /* Texto laranja para destaque */
        padding: 15px;
        font-size: 2rem; /* Fonte maior para o código */
        letter-spacing: 10px; /* Espaçamento entre números */
        text-align: center;
        font-weight: 600;
    }

    .form-control:focus {
        background-color: #252525;
        border-color: #e65100;
        box-shadow: 0 0 0 0.25rem rgba(230, 81, 0, 0.25);
        outline: none;
    }

    .btn-primary {
        background-color: #e65100;
        border-color: #e65100;
        border-radius: 12px;
        padding: 15px;
        font-weight: 600;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        width: 100%;
    }

    .btn-primary:hover, .btn-primary:focus {
        background-color: #bf360c;
        border-color: #bf360c;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(230, 81, 0, 0.3);
    }

    .btn-outline-secondary {
        color: #000000;
        border-color: #bf360c;
        border-radius: 12px;
        padding: 10px;
        margin-top: 15px;
        width: 100%;
        transition: all 0.3s ease;
        border-width: 3px;
    }

    .btn-outline-secondary:hover {
        background-color: #333;
        color: #fff;
        border-color: #555;
    }

    .alert {
        border-radius: 12px;
        border: none;
        background-color: rgba(220, 53, 69, 0.2);
        color: #ff6b6b;
    }

    @media (max-width: 768px) {
        .login-container {
            flex-direction: column;
            height: auto;
        }
        .login-content, .login-image {
            width: 100%;
        }
        .login-image {
            height: 200px;
        }
    }
</style>
</head>
<body>
        <div class="login-container">
        <div class="login-content">
            <div class="mb-4">
                <h4 id="headerTitle">Verificação 2FA</h4>
                <p class="text-muted">Enviamos um código de verificação de 6 dígitos para o seu e-mail cadastrado.</p>
            </div>

            <div id="alertBox" class="alert alert-danger mb-4" style="display:none;" role="alert"></div>

            <form id="form2FA">
                <div class="my-5">
                    
                    <input type="text" class="form-control otp-input" id="tokenInput" maxlength="6" placeholder="000000" autocomplete="off">
                </div>

                <div class="d-grid gap-3" style="margin-top: 50px;">
                    <button type="button" id="btnVerificar" class="btn btn-primary btn-lg">VALIDAR ACESSO</button>
                    <button type="button" id="btnVoltar" class="btn btn-outline-secondary" style="margin-top: 20px;">Voltar para Login</button>
                </div>
            </form>

            <div class="mt-4 text-center" style="margin-top: 70px;">
                <small class="text-muted">Sistema Logístico Inteligente v1.0</small>
            </div>
        </div>
        
        <div class="login-image"></div>
    </div>

<script src="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js](https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js)"></script>

<script>
    $(document).ready(function() {
        $("#btnVerificar").click(function() {
            var token = $("#tokenInput").val();
            $("#alertBox").hide();

            $("#btnVerificar").prop("disabled", true).text("Validando...");

            $.ajax({
                url: "${pageContext.request.contextPath}/authServlet",
                type: "POST",
                data: {
                    action: "validate_2fa",
                    token: token
                },
                success: function(response) {
                    window.location.href = "menu.jsp"; 
                },
                error: function() {
                    $("#alertBox").removeClass("alert-danger").addClass("alert-warning"); // Ajuste visual se quiser mudar a cor
                    $("#alertBox").text("Código inválido ou expirado.").show();
                    $("#btnVerificar").prop("disabled", false).text("VALIDAR ACESSO"); // Texto em maiúsculo para manter padrão
                }
            });
        });

        $("#btnVoltar").click(function() {
            window.location.href = "index.jsp"; 
        });
    });
</script>
</body>
</html>
