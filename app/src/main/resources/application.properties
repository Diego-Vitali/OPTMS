spring.application.name=app

spring.datasource.url=jdbc:postgresql://localhost:5432/TMA?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

master.api.key=0000abc

# ML API
ml.api.base-url=http://localhost:8001

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.error.include-message=always

springdoc.paths-to-match=/api/cotacoes,/api/cotacoes/**,/api/previsao-entrega
